<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HORSE | Dashboard de RICs</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<aside class="side">
  <div class="logo" id="logoHorse">HORSE</div>
  <button class="btn main" id="atualizar">⟳ Atualizar planilha</button>
  <button class="btn" id="modoExec">Modo executivo</button>
  <button class="btn" id="togGraf">Ocultar gráficos</button>
  <label class="small">Aba da planilha<select id="aba"></select></label>
  <label class="small">Cálculo do valor
    <select id="metodo"><option value="todos">Somar todos os itens</option><option value="unico">Um Valor RC por requisição</option></select></label>
  <p class="small" id="metodoAtual"></p>
  <h4>Exportar</h4>
  <button class="btn" id="expFiltrada">Visão filtrada</button>
  <button class="btn" id="expPend">Pendências</button>
  <button class="btn" id="expAtencao">Casos em atenção</button>
</aside>
<main>
  <input type="file" id="arquivo" accept=".xlsx,.xls,.xlsm" hidden>
  <label class="drop" id="drop" for="arquivo">📂 Arraste a planilha Excel aqui ou clique para importar</label>
  <div id="loading" class="loading" hidden>Processando planilha...</div>
  <div id="msg" class="msg" hidden></div>
  <section id="validacao" class="card small" hidden></section>
  <div class="busca">
    <input id="busca" placeholder="🔎 Pesquisar RIC, pedido, material, fornecedor, requisitante, centro de custo, ordem, PEP...">
    <button class="btn" id="limparBusca">Limpar pesquisa</button>
  </div>
  <div id="rapidos" class="chips">
    <button class="chip" data-r="todas">Todas</button><button class="chip" data-r="pendente">Pendentes</button>
    <button class="chip" data-r="aprovacao">Em aprovação</button><button class="chip" data-r="pedido">Com pedido</button>
    <button class="chip" data-r="migo">Com MIGO</button><button class="chip" data-r="compensada">Compensadas</button>
    <button class="chip" data-r="atencao">Em atenção</button><button class="chip" data-r="atrasada">Mais de 30 dias</button>
  </div>
  <section id="kpis" class="kpis"></section>
  <section id="prioridades" class="card"></section>
  <section class="card filtros nex">
    <label class="small">De<input type="date" id="dtIni"></label>
    <label class="small">Até<input type="date" id="dtFim"></label>
    <div id="filtrosSelect" class="grid-filtros"></div>
    <button class="btn" id="limpar">Limpar filtros</button>
  </section>
  <p id="contador" class="contador"></p>
  <section id="graficos" class="graficos">
    <div class="card nex"><h3>RICs por situação</h3><canvas id="g1"></canvas></div>
    <div class="card nex"><h3>Valor RC por situação</h3><canvas id="g2"></canvas></div>
    <div class="card"><h3>RICs pendentes por responsável</h3><canvas id="g3"></canvas></div>
    <div class="card nex"><h3>RICs por centro de custo</h3><canvas id="g4"></canvas></div>
    <div class="card nex"><h3>RICs por fornecedor</h3><canvas id="g5"></canvas></div>
    <div class="card nex"><h3>Evolução mensal</h3><canvas id="g6"></canvas></div>
    <div class="card"><h3>Tempo médio de processamento (dias)</h3><canvas id="g7"></canvas><p class="small" id="g7info"></p></div>
  </section>
  <section id="tabela" class="card nex">
    <div class="barra">
      <label class="small">Por página<select id="porPagina"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label>
      <details class="cols"><summary class="btn">Colunas</summary><div id="colsList"></div></details>
      <span id="pagInfo" class="small"></span>
      <button class="btn" id="ant">‹ Anterior</button><button class="btn" id="prox">Próxima ›</button>
    </div>
    <div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>
</main>
<dialog id="detalhe"><button class="btn" id="fechar">Fechar</button><div id="detalheCorpo"></div></dialog>
<script src="script.js"></script>
</body>
</html>
